[project]
name = "canary"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "smartfood-otel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canary"]

[tool.uv.sources]
smartfood-otel = { workspace = true }

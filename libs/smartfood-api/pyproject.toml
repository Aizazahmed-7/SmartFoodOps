[project]
name = "smartfood-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "structlog>=24.4", "smartfood-otel"]

[tool.uv.sources]
smartfood-otel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartfood_api"]

[project]
name = "smartfood-kafka"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "aiokafka>=0.11",
    "fastavro>=1.9",
    "httpx>=0.27",
    "structlog>=24.4",
    "smartfood-otel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartfood_kafka"]

[tool.uv.sources]
smartfood-otel = { workspace = true }

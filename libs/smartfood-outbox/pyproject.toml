[project]
name = "smartfood-outbox"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy[asyncio]>=2.0", "smartfood-kafka"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartfood_outbox"]

[tool.uv.sources]
smartfood-kafka = { workspace = true }

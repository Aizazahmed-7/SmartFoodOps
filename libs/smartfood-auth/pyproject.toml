[project]
name = "smartfood-auth"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pyjwt[crypto]>=2.9", "httpx>=0.27", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartfood_auth"]

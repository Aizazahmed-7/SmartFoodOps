name: smartfoodops

# Profiles: core (infra — incl. rabbitmq since S10), apps (services), ui
# (consoles), obs (later), cdc (later — OUTBOX_MODE=poller is the dev default)
# Chaos/log knobs interpolate from the environment (defaults in .env.example) so
# `make chaos` can raise them without editing this file.
# Ports follow docs/local-dev.md exactly. Clients always enter via nginx on :8080.

x-app-base: &app-base
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  working_dir: /repo
  volumes:
    - ../..:/repo
    - uv-cache:/root/.cache/uv
    - venvs:/venvs
  environment: &app-env
    UV_LINK_MODE: copy
    CELL_ID: c1
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP: kafka:9092
    TEMPORAL_ADDRESS: temporal:7233
    OUTBOX_MODE: ${OUTBOX_MODE:-poller}
    # Set by `make up-obs` (the only profile that runs a collector);
    # empty everywhere else so services never export into a void.
    OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    KAFKA_CONSUMERS: "on"
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    IDENTITY_BASE_URL: http://identity:8001
    CATALOG_BASE_URL: http://catalog:8002
    INVENTORY_BASE_URL: http://inventory:8005
    ORDER_BASE_URL: http://order:8006
    ANALYTICS_BASE_URL: http://analytics:8009
    PAYMENT_BASE_URL: http://payment:8007
    NOTIFICATION_BASE_URL: http://notification:8008
    MOCK_PSP_BASE_URL: http://mock-psp:9080
    MAILER_BASE_URL: http://mock-mailer:9081
    # Arms the receipts pipeline (S10) — only notification and its workers
    # read this. guest/guest is the rabbitmq image's dev default.
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    IDENTITY_JWKS_URL: http://identity:8001/.well-known/jwks.json
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    kafka: { condition: service_healthy }
    temporal: { condition: service_started }

services:
  # ── core profile ────────────────────────────────────────────────
  schema-registry:
    profiles: [core]
    image: confluentinc/cp-schema-registry:7.6.1
    # Host 8086 (another local project intermittently serves 8081 on this
    # machine); in-network stays schema-registry:8081.
    ports: ["8086:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  postgres:
    profiles: [core]
    image: postgres:15
    ports: ["5432:5432"]
    # logical WAL: what Debezium's pgoutput plugin decodes (S6). Costs a
    # little WAL volume; changes nothing for normal SQL clients.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: sfo
      POSTGRES_PASSWORD: sfo
      POSTGRES_DB: sfo
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfo"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    # Host 6380: 6379 is held by the local-deployment project's redis.
    # In-network stays redis:6379 — only host-side tools use 6380.
    profiles: [core]
    image: redis:7
    ports: ["6380:6379"]
    command: ["redis-server", "--maxmemory-policy", "volatile-ttl"]

  # Un-parked by S10: the receipts pipeline speaks AMQP (Celery broker).
  # Management UI on :15672 (guest/guest — the image's dev defaults).
  rabbitmq:
    profiles: [core]
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  kafka:
    profiles: [core]
    image: apache/kafka:3.8.0
    ports: ["19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  temporal:
    profiles: [core]
    image: temporalio/temporal:latest
    user: root
    ports: ["7233:7233", "8233:8233"]
    entrypoint: ["temporal"]
    command:
      [
        "server",
        "start-dev",
        "--ip",
        "0.0.0.0",
        "--ui-port",
        "8233",
        "--db-filename",
        "/data/temporal.db",
      ]
    volumes:
      - temporal-data:/data

  localstack:
    profiles: [core]
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      SERVICES: dynamodb,s3  # s3: receipt PDFs (S10) — receipts/{order_id}.pdf
    volumes:
      - localstack-data:/var/lib/localstack

  mock-psp:
    <<: *app-base
    profiles: [core]
    ports: ["9080:9080"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/mock-psp
      DECLINE_RATE: ${DECLINE_RATE:-0.0}
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0.0}
      UNKNOWN_OUTCOME_RATE: ${UNKNOWN_OUTCOME_RATE:-0.0}
      LATENCY_MS_P50: ${LATENCY_MS_P50:-40}
    command:
      [
        "uv",
        "run",
        "--package",
        "mock-psp",
        "uvicorn",
        "mock_psp.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9080",
        "--reload",
        "--no-access-log",
      ]
    depends_on: {}

  mock-mailer:
    <<: *app-base
    profiles: [core]
    ports: ["9081:9081"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/mock-mailer
      FAIL_RATE: ${MAILER_FAIL_RATE:-0.0}
    command:
      [
        "uv",
        "run",
        "--package",
        "mock-mailer",
        "uvicorn",
        "mock_mailer.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9081",
        "--reload",
        "--no-access-log",
      ]
    depends_on: {}

  gateway:
    profiles: [core]
    image: nginx:1.27
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ── apps profile ────────────────────────────────────────────────
  identity:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8001:8001"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/identity
      DATABASE_URL: postgresql+asyncpg://identity_svc:identity_svc@postgres:5432/identity_db
    command:
      [
        "uv",
        "run",
        "--package",
        "identity",
        "uvicorn",
        "identity.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
        "--no-access-log",
      ]

  catalog:
    <<: *app-base
    profiles: [apps]
    ports: ["8002:8002"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/catalog
      DATABASE_URL: postgresql+asyncpg://catalog_svc:catalog_svc@postgres:5432/catalog_db
      # S8: MenuViewed telemetry straight to Kafka (no outbox — see
      # catalog/adapters/browse.py).
      BROWSE_EVENTS: "on"
    command:
      [
        "uv",
        "run",
        "--package",
        "catalog",
        "uvicorn",
        "catalog.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
        "--no-access-log",
      ]

  inventory:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8005:8005"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/inventory
      DATABASE_URL: postgresql+asyncpg://inventory_svc:inventory_svc@postgres:5432/inventory_db
    command:
      [
        "uv",
        "run",
        "--package",
        "inventory",
        "uvicorn",
        "inventory.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8005",
        "--reload",
        "--no-access-log",
      ]

  order:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8006:8006"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/order
      DATABASE_URL: postgresql+asyncpg://order_svc:order_svc@postgres:5432/order_db
      # Pre-confirmation saga deadline (see ARCHITECTURE §6.1). Overridable so
      # a demo can watch the unwind without waiting five real minutes:
      #   FORWARD_DEADLINE_S=30 make up-m2
      FORWARD_DEADLINE_S: ${FORWARD_DEADLINE_S:-300}
    command:
      [
        "uv",
        "run",
        "--package",
        "order",
        "uvicorn",
        "order.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8006",
        "--reload",
        "--no-access-log",
      ]

  order-worker:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/order
      DATABASE_URL: postgresql+asyncpg://order_svc:order_svc@postgres:5432/order_db
    command: ["uv", "run", "--package", "order", "python", "-m", "order.worker"]

  payment:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8007:8007"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/payment
      DATABASE_URL: postgresql+asyncpg://payment_svc:payment_svc@postgres:5432/payment_db
    command:
      [
        "uv",
        "run",
        "--package",
        "payment",
        "uvicorn",
        "payment.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8007",
        "--reload",
        "--no-access-log",
      ]

  notification:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8008:8008"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/notification
      DATABASE_URL: postgresql+asyncpg://notification_svc:notification_svc@postgres:5432/notification_db
    command:
      [
        "uv",
        "run",
        "--package",
        "notification",
        "uvicorn",
        "notification.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8008",
        "--reload",
        "--no-access-log",
      ]

  # Receipts workers (S10): ONE process per QUEUE, so the CPU half and the
  # I/O half scale (and log) independently — the queue split is the whole
  # point. Both retry the broker on boot (broker_connection_retry_on_startup)
  # rather than depending on rabbitmq cross-profile. Same venv as
  # notification — the order/order-worker precedent.
  #
  # --pool threads, NOT prefork, in dev ON PURPOSE: prometheus counters
  # incremented in forked children never reach the parent's /metrics
  # server (per-process registries) — prefork here would export zeros
  # forever. Threads keep tasks in the serving process, so the scraped
  # numbers are true. Prod prefork needs PROMETHEUS_MULTIPROC_DIR.
  receipt-renderer:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/notification
      DATABASE_URL: postgresql+asyncpg://notification_svc:notification_svc@postgres:5432/notification_db
      WORKER_METRICS_PORT: "9109"
    # -B: exactly ONE beat in the fleet rides here (two beats = every sweep
    # twice). The schedule file lives in /tmp so the repo mount stays clean.
    command:
      [
        "uv",
        "run",
        "--package",
        "notification",
        "celery",
        "-A",
        "notification.tasks:celery_app",
        "worker",
        "-Q",
        "receipts.render",
        "--pool",
        "threads",
        "--concurrency",
        "2",
        "-B",
        "-s",
        "/tmp/celerybeat-schedule",
        "--loglevel",
        "INFO",
      ]

  receipt-sender:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/notification
      DATABASE_URL: postgresql+asyncpg://notification_svc:notification_svc@postgres:5432/notification_db
      WORKER_METRICS_PORT: "9110"
    command:
      [
        "uv",
        "run",
        "--package",
        "notification",
        "celery",
        "-A",
        "notification.tasks:celery_app",
        "worker",
        "-Q",
        "receipts.send",
        "--pool",
        "threads",
        "--concurrency",
        "8",
        "--loglevel",
        "INFO",
      ]

  analytics:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8009:8009"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/analytics
      DATABASE_URL: postgresql+asyncpg://analytics_svc:analytics_svc@postgres:5432/analytics_db
    command:
      [
        "uv",
        "run",
        "--package",
        "analytics",
        "uvicorn",
        "analytics.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8009",
        "--reload",
        "--no-access-log",
      ]

  edge-bff:
    <<: *app-base
    profiles: [apps]
    ports: ["8000:8000"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/edge-bff
      # Rate limiting (db 1 — catalog's cache owns db 0; separate keyspaces
      # so flushing one can never clear the other).
      REDIS_URL: redis://redis:6379/1
    command:
      [
        "uv",
        "run",
        "--package",
        "edge-bff",
        "uvicorn",
        "edge_bff.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--no-access-log",
      ]

  # ── ui profile — management consoles ────────────────────────────
  # Postgres has no container UI on purpose: connect your desktop pgAdmin
  # to localhost:5432 (user sfo / password sfo, maintenance DB "sfo").
  kafka-console:
    profiles: [ui]
    image: docker.redpanda.com/redpandadata/console:latest
    ports: ["8085:8080"]
    environment:
      KAFKA_BROKERS: kafka:9092
      # Both spellings so the console decodes Avro regardless of version
      # (v2 nests schema registry under kafka.*, v3 moved it top-level).
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://schema-registry:8081
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://schema-registry:8081
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_started }

  redis-commander:
    profiles: [ui]
    image: ghcr.io/joeferner/redis-commander:latest
    # 8086 belongs to schema-registry (8081 is squatted by another local app)
    ports: ["8087:8081"]
    environment:
      REDIS_HOSTS: global-redis:redis:6379
    depends_on:
      redis: { condition: service_started }

  # ── CDC (profile cdc): make up-cdc — Debezium replaces the poller ──
  kafka-connect:
    profiles: [cdc]
    # quay.io is Debezium's canonical registry — Docker Hub has no 2.7 tag
    # (learned the hard way during a night the network stalled both, which
    # masked the not-found as a hang until morning).
    image: quay.io/debezium/connect:2.7
    restart: unless-stopped
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sfo-cdc
      CONFIG_STORAGE_TOPIC: _connect.config
      OFFSET_STORAGE_TOPIC: _connect.offsets
      STATUS_STORAGE_TOPIC: _connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    # No depends_on: cross-profile validation breaks (the kafka-exporter
    # lesson); restart-until-broker-is-up covers boot ordering.

  # ── observability (profile obs): make up-obs ─────────────────────
  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.57
    ports: ["16686:16686"]   # UI; OTLP intake on 4318 stays compose-internal
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  alertmanager:
    profiles: [obs]
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  canary:
    # Deliberately NOT *app-base: the anchor's depends_on names core-profile
    # services, which breaks obs-profile validation. The canary needs only
    # the gateway URL and the workspace mount — it retries on its own.
    profiles: [obs]
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /repo
    restart: unless-stopped
    volumes:
      - ../..:/repo
      - uv-cache:/root/.cache/uv
      - venvs:/venvs
    environment:
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /venvs/canary
      GATEWAY_URL: http://gateway:80
      CANARY_INTERVAL_SECONDS: "60"
    command: ["uv", "run", "--package", "canary", "python", "-m", "canary.main"]

  loki:
    profiles: [obs]
    image: grafana/loki:2.9.8
    ports: ["3100:3100"]

  promtail:
    profiles: [obs]
    image: grafana/promtail:3.4.0
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  cadvisor:
    profiles: [obs]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports: ["8082:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  kafka-exporter:
    profiles: [obs]
    image: danielqsj/kafka-exporter:v1.7.0
    command: ["--kafka.server=kafka:9092"]
    # No depends_on: kafka lives in the core profile, and cross-profile
    # dependencies break profile-scoped validation. The exporter simply
    # crash-restarts until the broker answers.
    restart: unless-stopped

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage   # store the trace_id dots
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      # Demo posture: no login wall. Anyone on localhost is an editor.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_started }

volumes:
  prometheus-data:
  pg-data:
  kafka-data:
  temporal-data:
  localstack-data:
  uv-cache:
  venvs:

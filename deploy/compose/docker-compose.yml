name: smartfoodops

# Profiles: core (infra), apps (services), ui (consoles), chores (rabbitmq — parked until
# Celery lands), obs (later), cdc (later — OUTBOX_MODE=poller is the dev default)
# Chaos/log knobs interpolate from the environment (defaults in .env.example) so
# `make chaos` can raise them without editing this file.
# Ports follow docs/local-dev.md exactly. Clients always enter via nginx on :8080.

x-app-base: &app-base
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  working_dir: /repo
  volumes:
    - ../..:/repo
    - uv-cache:/root/.cache/uv
    - venvs:/venvs
  environment: &app-env
    UV_LINK_MODE: copy
    CELL_ID: c1
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP: kafka:9092
    TEMPORAL_ADDRESS: temporal:7233
    OUTBOX_MODE: ${OUTBOX_MODE:-poller}
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    KAFKA_CONSUMERS: "on"
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    IDENTITY_BASE_URL: http://identity:8001
    CATALOG_BASE_URL: http://catalog:8002
    INVENTORY_BASE_URL: http://inventory:8005
    ORDER_BASE_URL: http://order:8006
    PAYMENT_BASE_URL: http://payment:8007
    NOTIFICATION_BASE_URL: http://notification:8008
    MOCK_PSP_BASE_URL: http://mock-psp:9080
    IDENTITY_JWKS_URL: http://identity:8001/.well-known/jwks.json
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    kafka: { condition: service_healthy }
    temporal: { condition: service_started }

services:
  # ── core profile ────────────────────────────────────────────────
  schema-registry:
    profiles: [core]
    image: confluentinc/cp-schema-registry:7.6.1
    # Host 8086 (another local project intermittently serves 8081 on this
    # machine); in-network stays schema-registry:8081.
    ports: ["8086:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  postgres:
    profiles: [core]
    image: postgres:15
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: sfo
      POSTGRES_PASSWORD: sfo
      POSTGRES_DB: sfo
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfo"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    # Host 6380: 6379 is held by the local-deployment project's redis.
    # In-network stays redis:6379 — only host-side tools use 6380.
    profiles: [core]
    image: redis:7
    ports: ["6380:6379"]
    command: ["redis-server", "--maxmemory-policy", "volatile-ttl"]

  # Parked in `chores` until Celery/notification lands — nothing speaks AMQP
  # today, so it has no business costing RAM in every `make up`.
  rabbitmq:
    profiles: [chores]
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  kafka:
    profiles: [core]
    image: apache/kafka:3.8.0
    ports: ["19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  temporal:
    profiles: [core]
    image: temporalio/temporal:latest
    user: root
    ports: ["7233:7233", "8233:8233"]
    entrypoint: ["temporal"]
    command:
      [
        "server",
        "start-dev",
        "--ip",
        "0.0.0.0",
        "--ui-port",
        "8233",
        "--db-filename",
        "/data/temporal.db",
      ]
    volumes:
      - temporal-data:/data

  localstack:
    profiles: [core]
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      SERVICES: dynamodb
    volumes:
      - localstack-data:/var/lib/localstack

  mock-psp:
    <<: *app-base
    profiles: [core]
    ports: ["9080:9080"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/mock-psp
      DECLINE_RATE: ${DECLINE_RATE:-0.0}
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0.0}
      UNKNOWN_OUTCOME_RATE: ${UNKNOWN_OUTCOME_RATE:-0.0}
      LATENCY_MS_P50: ${LATENCY_MS_P50:-40}
    command:
      [
        "uv",
        "run",
        "--package",
        "mock-psp",
        "uvicorn",
        "mock_psp.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9080",
        "--reload",
      ]
    depends_on: {}

  gateway:
    profiles: [core]
    image: nginx:1.27
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ── apps profile ────────────────────────────────────────────────
  identity:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8001:8001"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/identity
      DATABASE_URL: postgresql+asyncpg://identity_svc:identity_svc@postgres:5432/identity_db
    command:
      [
        "uv",
        "run",
        "--package",
        "identity",
        "uvicorn",
        "identity.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]

  catalog:
    <<: *app-base
    profiles: [apps]
    ports: ["8002:8002"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/catalog
      DATABASE_URL: postgresql+asyncpg://catalog_svc:catalog_svc@postgres:5432/catalog_db
    command:
      [
        "uv",
        "run",
        "--package",
        "catalog",
        "uvicorn",
        "catalog.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
      ]

  inventory:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8005:8005"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/inventory
      DATABASE_URL: postgresql+asyncpg://inventory_svc:inventory_svc@postgres:5432/inventory_db
    command:
      [
        "uv",
        "run",
        "--package",
        "inventory",
        "uvicorn",
        "inventory.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8005",
        "--reload",
      ]

  order:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8006:8006"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/order
      DATABASE_URL: postgresql+asyncpg://order_svc:order_svc@postgres:5432/order_db
    command:
      [
        "uv",
        "run",
        "--package",
        "order",
        "uvicorn",
        "order.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8006",
        "--reload",
      ]

  order-worker:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/order
      DATABASE_URL: postgresql+asyncpg://order_svc:order_svc@postgres:5432/order_db
    command: ["uv", "run", "--package", "order", "python", "-m", "order.worker"]

  payment:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8007:8007"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/payment
      DATABASE_URL: postgresql+asyncpg://payment_svc:payment_svc@postgres:5432/payment_db
    command:
      [
        "uv",
        "run",
        "--package",
        "payment",
        "uvicorn",
        "payment.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8007",
        "--reload",
      ]

  notification:
    <<: *app-base
    profiles: [apps]
    restart: unless-stopped
    ports: ["8008:8008"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/notification
      DATABASE_URL: postgresql+asyncpg://notification_svc:notification_svc@postgres:5432/notification_db
    command:
      [
        "uv",
        "run",
        "--package",
        "notification",
        "uvicorn",
        "notification.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8008",
        "--reload",
      ]

  edge-bff:
    <<: *app-base
    profiles: [apps]
    ports: ["8000:8000"]
    environment:
      <<: *app-env
      UV_PROJECT_ENVIRONMENT: /venvs/edge-bff
    command:
      [
        "uv",
        "run",
        "--package",
        "edge-bff",
        "uvicorn",
        "edge_bff.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  # ── ui profile — management consoles ────────────────────────────
  # Postgres has no container UI on purpose: connect your desktop pgAdmin
  # to localhost:5432 (user sfo / password sfo, maintenance DB "sfo").
  kafka-console:
    profiles: [ui]
    image: docker.redpanda.com/redpandadata/console:latest
    ports: ["8085:8080"]
    environment:
      KAFKA_BROKERS: kafka:9092
      # Both spellings so the console decodes Avro regardless of version
      # (v2 nests schema registry under kafka.*, v3 moved it top-level).
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://schema-registry:8081
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://schema-registry:8081
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_started }

  redis-commander:
    profiles: [ui]
    image: ghcr.io/joeferner/redis-commander:latest
    # 8086 belongs to schema-registry (8081 is squatted by another local app)
    ports: ["8087:8081"]
    environment:
      REDIS_HOSTS: global-redis:redis:6379
    depends_on:
      redis: { condition: service_started }

volumes:
  pg-data:
  kafka-data:
  temporal-data:
  localstack-data:
  uv-cache:
  venvs:

apiVersion: 1
datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # The exemplar dots: click a trace_id on any histogram panel and land
      # in the Jaeger datasource on that exact trace.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: Jaeger
  - name: Jaeger
    uid: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Every log line carries trace_id (the middleware binds it). This
      # regex turns it into a button that opens the trace in the Jaeger
      # datasource — logs→traces in one click.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id": "([a-f0-9]{32})"'
          datasourceUid: Jaeger
          url: "$${__value.raw}"
  - name: AnalyticsDB
    # The BUSINESS truth (order facts), next to the operational truth.
    # grafana_ro: SELECT-only by role — a dashboard may look, never touch.
    type: postgres
    uid: AnalyticsDB
    url: postgres:5432
    user: grafana_ro
    secureJsonData:
      password: grafana_ro
    jsonData:
      database: analytics_db
      sslmode: disable
      postgresVersion: 1500

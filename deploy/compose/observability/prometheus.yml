# Scrape map for the SmartFoodOps cell. Every FastAPI service exposes
# /metrics via mount_observability; the order WORKER (no HTTP app) serves a
# bare exposition server on :9106 — that target is where saga outcomes live.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: identity
    static_configs: [{ targets: ["identity:8001"] }]
  - job_name: catalog
    static_configs: [{ targets: ["catalog:8002"] }]
  - job_name: inventory
    static_configs: [{ targets: ["inventory:8005"] }]
  - job_name: order
    static_configs: [{ targets: ["order:8006"] }]
  - job_name: order-worker
    static_configs: [{ targets: ["order-worker:9106"] }]
  - job_name: payment
    static_configs: [{ targets: ["payment:8007"] }]
  - job_name: notification
    static_configs: [{ targets: ["notification:8008"] }]
  - job_name: edge-bff
    static_configs: [{ targets: ["edge-bff:8000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

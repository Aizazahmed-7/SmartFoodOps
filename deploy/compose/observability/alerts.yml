# The SLOs the ADRs assert, armed. Thresholds cite their source so nobody
# has to archaeology them later.
groups:
  - name: smartfoodops
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} target is unreachable"
          runbook: docs/runbooks.md#servicedown
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: HttpErrorRateHigh
        # >5% of requests answering 5xx over 10m, per service.
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{status=~"5.."}[10m]))
            / sum by (job) (rate(http_request_duration_seconds_count[10m])) > 0.05
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} 5xx ratio above 5%"
          runbook: docs/runbooks.md#httperrorratehigh
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: PlacementP95Breach
        # NFR-2: placement p95 < 3s — measured on FRESH placements only
        # (replays/refusals answer in microseconds and would flatter it).
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(order_placement_seconds_bucket{outcome="placed"}[10m]))) > 3
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "placement p95 above the 3s SLO (NFR-2)"
          runbook: docs/runbooks.md#placementp95breach
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: OutboxPublishLagHigh
        # NFR-6: outbox publish lag p99 < 5s.
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(outbox_publish_lag_seconds_bucket[10m]))) > 5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "outbox staged→published p99 above 5s (NFR-6)"
          runbook: docs/runbooks.md#outboxpublishlaghigh
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: OutboxBacklogGrowing
        expr: outbox_pending > 100
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "outbox backlog above 100 rows for 10m — poller stalled?"
          runbook: docs/runbooks.md#outboxbackloggrowing
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: EventsParkedOnDLQ
        # ADR-0021: ANY parked event is an ops item — it means five retries
        # failed or the bytes were undecodable.
        expr: increase(consumer_events_total{result="dlq"}[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.group }} parked events to its DLQ"
          runbook: docs/runbooks.md#eventsparkedondlq
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: SystemTimeoutCancels
        # The forward-deadline unwind firing means a dependency stayed down
        # past forward_deadline_s while customers were ordering.
        expr: increase(order_saga_outcomes_total{reason="system_timeout"}[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "orders cancelled by the saga's forward deadline"
          runbook: docs/runbooks.md#systemtimeoutcancels
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: ConsumerLagGrowing
        # Real lag from the broker's books (kafka-exporter) — a group
        # falling behind its topic. Trend matters more than the number.
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 100
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "{{ $labels.consumergroup }} is {{ $value }} events behind on {{ $labels.topic }}"
          runbook: docs/runbooks.md#consumerlaggrowing
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: CanarySilent
        # The synthetic customer has not completed an order in 5 minutes —
        # or has NEVER succeeded (absent). "Everything up, nothing working"
        # is exactly the failure every per-component signal misses.
        expr: |
          (time() - canary_last_success_timestamp_seconds > 300)
            or absent(canary_last_success_timestamp_seconds) == 1
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "the canary cannot place an order — customers likely cannot either"
          runbook: docs/runbooks.md#canarysilent
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: WorkerTargetAbsent
        # ServiceDown (up == 0) CANNOT see this one. order-worker is found by
        # dns_sd, and a dead container means Docker DNS returns nothing at
        # all -- Prometheus reads an empty target list, so `up` goes ABSENT
        # rather than 0 and the page never fires. Absence IS the symptom for
        # every discovery-based target, and this is the process whose death
        # stalls every saga (compensations still run, but only on the 300s
        # forward deadline -- the customer waits either way).
        expr: |
          absent(up{job="order-worker"}) == 1
            or absent(up{job="order-worker-temporal"}) == 1
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "no order-worker instance is being discovered — sagas are not advancing"
          runbook: docs/runbooks.md#workertargetabsent
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: TracingDisarmed
        # A service recreated outside `make up-obs` comes back with an empty
        # OTLP_ENDPOINT: still serving, still logging, silently NOT tracing.
        # Nobody notices until an incident needs traces that were never
        # recorded. The canary is excluded on purpose -- it is a client, it
        # never arms tracing, and its 0 is not drift.
        expr: min by (job) (tracing_armed{job!="canary"}) == 0
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "{{ $labels.job }} is running without tracing — recreate it via make up-obs"
          runbook: docs/runbooks.md#tracingdisarmed
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: RateLimitSpike
        # Sustained throttling of one class: either an attack the limiter is
        # correctly absorbing, or a broken client (retry loop) burning its
        # own budget — both worth a human look, neither worth a page.
        expr: sum by (route_class) (rate(rate_limited_total[5m])) * 60 > 30
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "{{ $labels.route_class }} traffic throttled at {{ $value | printf \"%.0f\" }}/min for 10m"
          runbook: docs/runbooks.md#ratelimitspike
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: ReceiptsSweeperBusy
        # The sweeper only ever finds work when the normal path failed:
        # a post-commit enqueue was lost (broker down at the wrong moment)
        # or sends are stalling past the grace window. Self-healing either
        # way — that is the sweeper's job — but repeated debt means the
        # pipeline is limping and someone should ask why.
        expr: increase(receipts_swept_total[15m]) > 0
        for: 1m
        labels: { severity: warn }
        annotations:
          summary: "the receipt sweeper re-enqueued {{ $value | printf \"%.0f\" }} owed receipt(s) in 15m — the direct path is losing work"
          runbook: docs/runbooks.md#receiptssweeperbusy
          dashboard: http://localhost:3000/d/smartfoodops-slo

      - alert: ReceiptParked
        # A permanent send failure parks the receipt (failed_at) OUT of
        # every retry loop, sweeper included — by design, poison must not
        # spin. Two flavors: the mailer refused (rejected) or identity has
        # no such user (no_recipient). Either way a customer is owed a
        # money document nothing automatic will deliver: a human clears
        # failed_at after the fix, or the receipt never sends.
        expr: increase(receipts_sent_total{outcome=~"rejected|no_recipient"}[1h]) > 0
        for: 1m
        labels: { severity: warn }
        annotations:
          summary: "a receipt was rejected by the mail provider and parked — it will NOT retry on its own"
          runbook: docs/runbooks.md#receiptparked
          dashboard: http://localhost:3000/d/smartfoodops-slo

  # ── the assistant plane (B7) ──────────────────────────────────────
  # Its own group, like its own consumer groups and its own dashboard: the
  # assistant is deliberately a 99.5% plane beside a 99.95% ordering path
  # (NFR-23), so its noise must never be mistaken for the ordering path's.
  - name: assistant
    rules:
      - alert: AssistantTimeToFirstTokenBreach
        # NFR-21: time-to-first-token p95 < 1.5s. The number a customer
        # actually feels — a streamed answer's HTTP duration is its
        # connection lifetime, which is why stream routes are kept out of
        # the HTTP histogram entirely.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(assistant_time_to_first_token_seconds_bucket[10m]))) > 1.5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "assistant time-to-first-token p95 above 1.5s (NFR-21)"
          runbook: docs/runbooks.md#assistanttimetofirsttokenbreach
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantAnswerLatencyBreach
        # NFR-21: complete answer p95 < 6s, on generation only. `explain`
        # is a different task with a different budget and averaging the two
        # would let a fast templated path hide a slow conversational one.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(assistant_response_seconds_bucket{task="generate"}[10m]))) > 6
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "assistant answer p95 above 6s (NFR-21)"
          runbook: docs/runbooks.md#assistantanswerlatencybreach
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantUngroundedAnswer
        # NFR-26: 100% of item references in SHIPPED answers resolve to
        # real items. This counter is post-validation leakage, so one is
        # not noise — it is a customer told about a dish that does not
        # exist. "An alerting signal, not a curiosity", in the NFR's words.
        expr: increase(assistant_ungrounded_total[15m]) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "a shipped answer cited something that was never retrieved (NFR-26)"
          runbook: docs/runbooks.md#assistantungroundedanswer
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantKnowledgeStale
        # NFR-28: a committed menu change is visible to retrieval within
        # 60s p99, and the NFR says staleness beyond that PAGES. A stale
        # index does not fail loudly: it answers confidently about a menu
        # the kitchen has already changed.
        #
        # Reads the BACKLOG gauge, not the freshness histogram, and that
        # correction matters more than the threshold. The histogram is
        # observed only when a restaurant is successfully indexed, so a
        # drain that never succeeds — the embedding provider hard-down —
        # observes nothing at all, every bucket's rate is zero,
        # histogram_quantile returns NaN, and `NaN > 60` is false. The page
        # stayed inactive in exactly the outage it exists for, while the
        # dashboard showed a flat gap that reads as "no menu changes".
        # The gauge rises when nothing is draining, which is the condition.
        expr: assistant_knowledge_backlog_seconds > 60
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "menu changes are taking over 60s to reach retrieval (NFR-28)"
          runbook: docs/runbooks.md#assistantknowledgestale
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantKnowledgeDrainFailing
        # The row stays queued when a drain pass raises, so this is a RETRY
        # rate and not a loss rate — hence warn. Sustained, it becomes the
        # cause of AssistantKnowledgeStale above.
        expr: increase(assistant_knowledge_drain_failures_total[15m]) > 3
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "the knowledge drain is failing repeatedly — the index is falling behind"
          runbook: docs/runbooks.md#assistantknowledgedrainfailing
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantProviderFailoversSustained
        # ADR-0030 §4. ONE failover is the design working — the secondary
        # caught it. A sustained rate means the primary is down and every
        # answer is paying the retry before it starts.
        #
        # A RATIO, because the condition is one. An absolute 0.1/s is 6
        # failovers a minute, so a cell serving 2 turns/min could have its
        # primary provider 503 on literally every call — every answer paying
        # a full failover round-trip, TTFT doubled — and never reach the
        # threshold. The share of calls that failed over works at any
        # traffic level; the floor keeps an idle window out of it.
        expr: |
          sum(rate(assistant_provider_failovers_total[10m]))
            / sum(rate(assistant_response_seconds_count[10m])) > 0.5
          and sum(rate(assistant_response_seconds_count[10m])) > 0.01
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "the assistant is routinely failing over to its secondary provider"
          runbook: docs/runbooks.md#assistantproviderfailoverssustained
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantSheddingCustomers
        # FR-102's budgets refusing calls BEFORE a provider sees them. A
        # per-user budget catching one heavy user is the mechanism working;
        # a cell budget refusing everyone is an outage wearing a polite
        # message, and the `reason` label is what separates them.
        #
        # `breaker_open` only. A single `user_budget` refusal — one customer
        # re-sending a long question at 02:00 — keeps `increase(...[10m])`
        # above zero for the full ten minutes, so `for: 5m` was always
        # satisfied by one routine event and the signal that matters was
        # buried under it. The per-user bucket doing its job is not an
        # incident; the cell-wide breaker refusing everyone is.
        expr: sum(increase(assistant_budget_refusals_total{reason="breaker_open"}[10m])) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "the cell breaker is refusing assistant calls before they reach a provider"
          runbook: docs/runbooks.md#assistantsheddingcustomers
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantWorkerTargetAbsent
        # The same trap WorkerTargetAbsent documents for order-worker, and
        # the newly added scrape job has the same dns_sd shape: a dead
        # container means Docker DNS returns nothing, Prometheus reads an
        # EMPTY target list, and `up` goes absent rather than 0 — so
        # ServiceDown matches nothing. Absence is the symptom. When this
        # worker dies the content studio and the reindex stop, and their
        # counters simply freeze at the last scraped value, which no panel
        # on the AI dashboard renders as a change.
        expr: absent(up{job="ai-assistant-worker"}) == 1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "no ai-assistant-worker is being discovered — content jobs and the reindex are not running"
          runbook: docs/runbooks.md#assistantworkertargetabsent
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantFactsLagging
        # The one that makes every OTHER number on the AI dashboard
        # trustworthy. `analytics.assistant.v1` projects the interaction
        # facts all six FR-95 metrics are read from. If it stalls, nothing
        # errors: the panels keep rendering, the window keeps sliding, and
        # the numbers quietly describe a shorter period than their label.
        expr: |
          sum by (consumergroup, topic) (
            kafka_consumergroup_lag{consumergroup="analytics.assistant.v1"}) > 100
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "assistant interaction facts are {{ $value }} events behind — the AI KPIs are stale"
          runbook: docs/runbooks.md#assistantfactslagging
          dashboard: http://localhost:3000/d/smartfoodops-assistant

  # ── cost governance (NFR-25) ──────────────────────────────────────
  # The budget is $0.004 per order (capacity-plan §7, A23). It is ~60x the
  # modelled cost on today's flash-lite models and ~2.4x the modelled cost
  # on a premium model, which is the point: it must survive a DELIBERATE
  # model upgrade and still catch an unintended loop. Warn at 60% of budget
  # per the capacity plan's standing rule that 60% triggers a planned
  # action, page at the budget itself.
  - name: assistant-cost
    rules:
      - alert: AssistantCostPerOrderElevated
        # The `and` is the lesson AssistantCacheHitRateCollapsed taught:
        # with no orders the denominator is zero, the ratio is +Inf, and a
        # quiet night pages. Only evaluated when orders are actually
        # flowing.
        expr: |
          assistant:usd_per_order > 0.0024
          and sum(rate(order_placement_seconds_count{outcome="placed"}[10m])) > 0.005
        for: 30m
        labels: { severity: warn }
        annotations:
          summary: "AI cost per order at {{ $value | printf \"$%.5f\" }} — 60% of the $0.004 budget (NFR-25)"
          runbook: docs/runbooks.md#assistantcostperorderelevated
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantCostPerOrderOverBudget
        expr: |
          assistant:usd_per_order > 0.004
          and sum(rate(order_placement_seconds_count{outcome="placed"}[10m])) > 0.005
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "AI cost per order at {{ $value | printf \"$%.5f\" }} — OVER the $0.004 budget (NFR-25)"
          runbook: docs/runbooks.md#assistantcostperorderoverbudget
          dashboard: http://localhost:3000/d/smartfoodops-assistant

      - alert: AssistantSpendUnpriced
        # Tokens billed by a vendor the price table cannot price. This does
        # not make the cost line a bit wrong — it makes it CONFIDENTLY LOW,
        # because an unpriced model drops out of the join and the panel
        # keeps rendering a smaller number with no gap in it. Every tripwire
        # above is blind for exactly that model until this is fixed.
        #
        # `for` SHORTER than the 10m rate window behind the series, which is
        # not a detail: a worker job on a 15-minute schedule makes this
        # non-zero for ten minutes and zero for five, so a 15m `for` reset
        # its pending state every cycle and the alert guarding the cost
        # design's one blind spot would never have fired at all.
        expr: sum(assistant:tokens_unpriced_per_second) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "tokens are being billed by a model with no row in the price table — every cost number below it is too low"
          runbook: docs/runbooks.md#assistantspendunpriced
          dashboard: http://localhost:3000/d/smartfoodops-assistant

# Ship every compose container's stdout to Loki, labeled by service.
# docker_sd asks the daemon for containers; relabel keeps the compose
# service name as the `service` label — so Grafana Explore queries read
# {service="order"} |= "trace_id" — the same grep, centralized.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      # The observability stack must not observe itself into the store:
      # Loki logging its own queries into Loki is a feedback loop of pure
      # noise. App + real infra (kafka, postgres, gateway) still ship.
      - source_labels: ["service"]
        regex: "loki|promtail|grafana|prometheus|jaeger|alertmanager|cadvisor|kafka-exporter"
        action: drop
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

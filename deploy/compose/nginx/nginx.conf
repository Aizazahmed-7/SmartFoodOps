events {}

http {
  # Lazy DNS resolution via Docker's embedded resolver so the gateway starts
  # even when app containers are down (core-only profile / slim mode).
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;

    # Mirrors the ALB listener rules exactly (docs/ARCHITECTURE.md §5.1).

    # IDENTITY IS MINTED INSIDE, NEVER ACCEPTED FROM OUTSIDE.
    #
    # The five `X-Auth-*` clears below are repeated in EVERY location, and
    # the repetition is not an oversight: nginx's `proxy_set_header` is a
    # replace-not-merge directive, so a location that sets any header of
    # its own discards every inherited one. Hoisting these to server scope
    # looks tidier and silently disarms all five in all five locations —
    # verified by doing exactly that and watching the forgery still work.
    #
    # Why it matters: the four /ws and /sse lanes bypass edge-bff and proxy
    # straight to a domain service, and services trust these headers
    # unconditionally (ARCHITECTURE §5.1 — "trustworthy because domain
    # services are network-unreachable except from edge/gateways/peers").
    # They cleared nothing, so a client could send its own `X-Auth-Sub` and
    # be believed. Measured: the lane answered 404 (identity accepted,
    # resource absent) where the ordinary lane answered 401.
    #
    # `X-Auth-Roles` is the PLURAL header `get_auth_context` actually
    # reads; `X-Auth-Role` is its retired singular ancestor, and only that
    # one was listed — so even the main lane forwarded the header that
    # mattered, harmless purely because edge-bff strips the set again.

    # Rider WebSocket (dispatch milestone). Direct to the rider-gateway,
    # bypassing the edge: the JWT rides Sec-WebSocket-Protocol and the
    # GATEWAY verifies it (ADR-0006) — the edge never sees sockets. The
    # Upgrade/Connection pair is what turns proxying into tunneling; the
    # read timeout sits above the client's own reconnect cadence.
    location /ws/rider {
      # set-variable defers DNS to request time (the /sse blocks' trick):
      # nginx (core profile) must boot before the apps profile exists.
      set $rider_gateway http://rider-gateway:8010;
      proxy_pass $rider_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 35m;
      proxy_send_timeout 35m;
      # See the note at the top of `server`: replace-not-merge, so these
      # live in every location rather than once above.
      proxy_set_header X-Auth-Sub "";
      proxy_set_header X-Auth-Role "";
      proxy_set_header X-Auth-Roles "";
      proxy_set_header X-Auth-Restaurant-Id "";
      proxy_set_header X-Auth-Rider-Id "";
    }

    # SSE order tracking (S4). Direct to the order service, BYPASSING the
    # edge on purpose: the single-use ticket is the auth (FR-38), minted by
    # the edge-authed POST /v1/track/ticket — so the stream fleet never
    # verifies JWTs. Buffering off or the events never leave this proxy;
    # read timeout above the 30-minute max stream lifetime. This location
    # is exactly where the dedicated tracking-gateway mounts later
    # (ARCHITECTURE §5.1) — the FE URL shape never changes.
    location /sse/track/ {
      set $order http://order:8006;
      rewrite ^/sse/track/(.*)$ /v1/track/$1 break;
      proxy_pass $order;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 35m;
      # See the note at the top of `server`: replace-not-merge, so these
      # live in every location rather than once above.
      proxy_set_header X-Auth-Sub "";
      proxy_set_header X-Auth-Role "";
      proxy_set_header X-Auth-Roles "";
      proxy_set_header X-Auth-Restaurant-Id "";
      proxy_set_header X-Auth-Rider-Id "";
    }

    # Bell push (S9): same design as /sse/track/ — direct to the service,
    # the ticket is the auth, buffering off. No identity in the URL at all:
    # the claim carries the channel.
    location /sse/notify {
      set $notification http://notification:8008;
      rewrite ^/sse/notify$ /v1/notifications/stream break;
      proxy_pass $notification;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 35m;
      # See the note at the top of `server`: replace-not-merge, so these
      # live in every location rather than once above.
      proxy_set_header X-Auth-Sub "";
      proxy_set_header X-Auth-Role "";
      proxy_set_header X-Auth-Roles "";
      proxy_set_header X-Auth-Restaurant-Id "";
      proxy_set_header X-Auth-Rider-Id "";
    }

    # Assistant token stream (B3). Same design again — direct to the
    # service, the single-use ticket is the auth (FR-68), buffering off.
    # The read timeout is deliberately SHORT here compared to the lanes
    # above: a generation lasts seconds and the stream's own lifetime reaps
    # a wedged one in two minutes, so a 35m timeout would only hold sockets
    # open for turns that are already dead.
    location /sse/assistant/ {
      set $assistant http://ai-assistant:8013;
      rewrite ^/sse/assistant/(.*)$ /v1/assistant/messages/$1 break;
      proxy_pass $assistant;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Resumption rides this header (ADR-0042 §4) — dropping it would turn
      # every reconnect into a full replay, silently and only under packet
      # loss, which is the hardest possible place to notice it.
      proxy_set_header Last-Event-ID $http_last_event_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 5m;
      # See the note at the top of `server`: replace-not-merge, so these
      # live in every location rather than once above.
      proxy_set_header X-Auth-Sub "";
      proxy_set_header X-Auth-Role "";
      proxy_set_header X-Auth-Roles "";
      proxy_set_header X-Auth-Restaurant-Id "";
      proxy_set_header X-Auth-Rider-Id "";
    }

    location / {
      set $edge http://edge-bff:8000;
      proxy_pass $edge;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Start $msec;
      # See the note at the top of `server`: replace-not-merge, so these
      # live in every location rather than once above.
      proxy_set_header X-Auth-Sub "";
      proxy_set_header X-Auth-Role "";
      proxy_set_header X-Auth-Roles "";
      proxy_set_header X-Auth-Restaurant-Id "";
      proxy_set_header X-Auth-Rider-Id "";
    }
  }
}

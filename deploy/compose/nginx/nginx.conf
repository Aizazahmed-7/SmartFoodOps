events {}

http {
  # Lazy DNS resolution via Docker's embedded resolver so the gateway starts
  # even when app containers are down (core-only profile / slim mode).
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;

    # Mirrors the ALB listener rules exactly (docs/ARCHITECTURE.md §5.1).
    # /ws/rider/* and /sse/track/* arrive in Phase 2 with the gateways.

    location /ws/rider/ {
      return 503 '{"error":"rider-gateway lands in phase 2"}';
      add_header Content-Type application/json always;
    }

    location /sse/track/ {
      return 503 '{"error":"tracking-gateway lands in phase 2"}';
      add_header Content-Type application/json always;
    }

    location / {
      set $edge http://edge-bff:8000;
      proxy_pass $edge;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Start $msec;
      # Strip any client-supplied identity headers before they reach the BFF;
      # the BFF strips again (defense in depth, ARCHITECTURE §5.2).
      proxy_set_header X-Auth-Sub "";
      proxy_set_header X-Auth-Role "";
      proxy_set_header X-Auth-Restaurant-Id "";
      proxy_set_header X-Auth-Rider-Id "";
    }
  }
}

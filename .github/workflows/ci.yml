# CI runs the same entry points as local dev (repo-structure.md §5): `make lint`
# (ruff check + format + pyright, all gating) and `make cov` (full unit suite with
# the 100% coverage gate). Frontend builds in its own job. Still to grow per the
# build plan: integration/consumer chaos (duplicate/poison) and nightly chaos (W3).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint (ruff + pyright)
        run: make lint

      - name: Unit tests + coverage gate
        run: make cov

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

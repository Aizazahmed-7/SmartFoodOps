[project]
name = "payment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "httpx>=0.27", "alembic>=1.13", "pydantic-settings>=2.5", "smartfood-api", "smartfood-auth", "smartfood-kafka", "smartfood-otel", "smartfood-outbox", "smartfood-idempotency"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payment"]

[tool.uv.sources]
smartfood-api = { workspace = true }
smartfood-auth = { workspace = true }
smartfood-kafka = { workspace = true }
smartfood-otel = { workspace = true }
smartfood-outbox = { workspace = true }
smartfood-idempotency = { workspace = true }

[project]
name = "order"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "redis>=5.1", "temporalio>=1.7", "smartfood-auth", "smartfood-otel", "smartfood-outbox", "smartfood-idempotency", "smartfood-pricing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["order"]

[tool.uv.sources]
smartfood-auth = { workspace = true }
smartfood-otel = { workspace = true }
smartfood-outbox = { workspace = true }
smartfood-idempotency = { workspace = true }
smartfood-pricing = { workspace = true }

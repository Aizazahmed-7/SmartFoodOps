[project]
name = "analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.13", "pydantic-settings>=2.5", "smartfood-api", "smartfood-auth", "smartfood-kafka", "smartfood-otel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics"]

[tool.uv.sources]
smartfood-api = { workspace = true }
smartfood-auth = { workspace = true }
smartfood-kafka = { workspace = true }
smartfood-otel = { workspace = true }

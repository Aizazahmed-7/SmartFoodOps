[project]
name = "edge-bff"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "pydantic-settings>=2.5", "redis>=5.1", "smartfood-auth", "smartfood-otel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_bff"]

[tool.uv.sources]
smartfood-auth = { workspace = true }
smartfood-otel = { workspace = true }

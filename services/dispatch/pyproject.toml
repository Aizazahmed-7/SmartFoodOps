[project]
name = "dispatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic-settings>=2.5", "boto3>=1.35", "redis>=5.1", "httpx>=0.27", "smartfood-api", "smartfood-auth", "smartfood-kafka", "smartfood-otel", "smartfood-realtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispatch"]

[tool.uv.sources]
smartfood-api = { workspace = true }
smartfood-auth = { workspace = true }
smartfood-kafka = { workspace = true }
smartfood-otel = { workspace = true }
smartfood-realtime = { workspace = true }

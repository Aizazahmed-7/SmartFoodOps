[project]
name = "identity"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "pyjwt[crypto]>=2.9", "alembic>=1.13", "pydantic-settings>=2.5", "email-validator>=2.2", "argon2-cffi>=23.1", "smartfood-api", "smartfood-auth", "smartfood-kafka", "smartfood-otel", "smartfood-outbox"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity"]

[tool.uv.sources]
smartfood-api = { workspace = true }
smartfood-kafka = { workspace = true }
smartfood-auth = { workspace = true }
smartfood-otel = { workspace = true }
smartfood-outbox = { workspace = true }

# Minimal by design: ruff via `uv run` so hooks use the locked workspace version —
# uv is the only globally installed tool (repo-structure.md §4). Heavier gates
# (import-linter, pyright, avro compat) stay in CI/make lint, not on every commit.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

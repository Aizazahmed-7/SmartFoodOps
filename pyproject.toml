[project]
name = "smartfoodops"
version = "0.1.0"
description = "SmartFoodOps — food ordering & delivery orchestration platform (Part A)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services", "tools"]

[tool.uv]
package = false

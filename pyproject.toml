[project]
name = "smartfoodops"
version = "0.1.0"
description = "SmartFoodOps — food ordering & delivery orchestration platform (Part A)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "pyright>=1.1.380",
]

[tool.pyright]
include = ["libs", "services", "tools"]
typeCheckingMode = "standard"
# Strict tier: libs/ + every service's domain/ — enforcement activates with Catalog.
# Strict tier (libs source + domain) activates with the Catalog milestone once
# the stubs strategy for structlog/SQLAlchemy Rows is decided (repo-structure §5).
reportUnusedFunction = false  # false-positives on decorator-registered handlers
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Skeleton worker keep-alive loop: sleep-forever is intentional (nothing to await yet).
# Remove when the real Temporal worker lands (W2).
"services/order/order/worker.py" = ["ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["libs", "services", "tools"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs each query on a greenlet; without greenlet
# tracing, coverage silently drops every line after a method's first awaited
# query and under-reports by ~30 points. Do not remove.
concurrency = ["thread", "greenlet"]

[tool.uv]
package = false
